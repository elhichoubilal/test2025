.receipt{display:none;position:fixed;inset:0;background:#fff;color:#000;z-index:999;overflow-y:auto;padding:20px;font-family:'Tajawal',sans-serif}
.receipt.show{display:block}
.rcclose{position:fixed;top:12px;right:12px;background:var(--red);color:#fff;border:none;border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:700;z-index:1000;font-size:.74rem}
.print-size-row{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.pszbtn{padding:6px 11px;border-radius:8px;font-family:inherit;font-weight:700;font-size:.72rem;cursor:pointer;border:1.5px solid;transition:.15s}
.pszbtn.a5{background:#f0f4ff;border-color:#4c6ef5;color:#4c6ef5}
.pszbtn.t80{background:#e6f7ee;border-color:#0d9e6e;color:#0d9e6e}
.pszbtn.a4{background:#f8f9fa;border-color:#868e96;color:#868e96}
.rcwrap{max-width:360px;margin:0 auto}
.rcdiv{border-top:1px dashed #ddd;margin:10px 0}
.rcr{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px}
.rcr .l{color:#888;font-weight:600}.rcr .v{font-weight:700}
.rctbox{background:#f8f9fa;border:1.5px solid #ddd;border-radius:10px;padding:14px;text-align:center;margin:12px 0}
.rctl{font-size:.72rem;color:#666;margin-bottom:5px;font-weight:600}
.rctv{font-size:1.5rem;font-weight:900}
.rctv.pos{color:#0a8a5f}.rctv.neg2{color:#c92a2a}
.rcsigns{display:flex;gap:16px;margin-top:20px}
.rcsign{flex:1;text-align:center}
.rcsline{border-top:1.5px solid #333;padding-top:5px;font-size:.65rem;color:#888;margin-top:28px}
.rc-footer{font-size:.66rem;color:#ccc;text-align:center;margin-top:10px;line-height:1.8}
.share-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.share-btn{flex:1;min-width:80px;padding:7px 6px;border-radius:var(--r3);border:1.5px solid;font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer;text-align:center;transition:.2s}
.share-btn.wa{background:#e8f5e9;border-color:#43a047;color:#2e7d32}
.share-btn.cp{background:#e8f1ff;border-color:rgba(37,99,235,.3);color:#1d4ed8}
.share-btn.sms{background:#f3f0ff;border-color:rgba(95,61,196,.3);color:#5b21b6}

/* PIECE DE RECETTE — OFFICIAL DUPLICATE RECEIPT */
.receipt-piece{display:none;position:fixed;inset:0;background:#fff;color:#000;z-index:999;overflow-y:auto;padding:20px;font-family:Arial,'Tajawal',sans-serif;direction:ltr;text-align:left}
.receipt-piece.show{display:block}
.piece-wrap{max-width:680px;margin:0 auto;direction:ltr;text-align:left}
.piece-copy{padding:10px 4px;font-size:.76rem;line-height:1.65;direction:ltr;text-align:left;font-family:Arial,sans-serif;color:#111}
.piece-sep{border-top:1px dashed #999;margin:18px 0}
.piece-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.piece-head-l{text-align:left}
.piece-head-r{text-align:right;padding-top:2px}
.piece-co{font-size:.82rem;font-weight:800}
.piece-addr{font-size:.66rem;margin-top:4px;line-height:1.5}
.piece-tel{font-size:.66rem;margin-top:2px}
.piece-ville{font-size:.66rem;margin-top:2px;padding-left:16px}
.piece-tt{font-size:.78rem;font-weight:800;text-decoration:underline}
.piece-num{font-size:.76rem;font-weight:800;margin-top:4px;text-align:left;padding-left:4px;}
.piece-frow{display:flex;gap:14px;margin-bottom:9px}
.pf-cell{flex:1 1 0;min-width:0}
.pf-cell.wide{flex:1.9 1 0}
.pf-label{font-weight:700}
.pf-val{font-weight:400}
.piece-foot{margin-top:16px;font-size:.76rem;padding-left:16px}


@media print{
body>*{display:none!important}
.receipt.show,.receipt-piece.show{display:block!important;position:static!important;padding:0!important}
.rcclose,.print-size-row,.share-row{display:none!important}
}
@page{size:A5 portrait;margin:8mm}
html,body{margin:0;background:#fff}
body{font-family:'Tajawal',sans-serif}

<script>
'use strict';
/* الحالة اللي كانت فالحاسبة (01-base.js) */
var LANG='ar',CUR={n:'',av:'',isAdmin:false},LAST={paid:0,off:0,diff:0},LAST_PIECE_NUM=null;
var P=window.parent&&window.parent!==window?window.parent:null;
function svH(){ if(P&&P.Print8&&window.__curH) P.Print8.persistPiece(window.__curH); }      /* buildPieceReceiptFromHist كيحفظ رقم الـ Pièce فالسجل */
function p8Close(){ document.querySelectorAll('.show').forEach(function(e){e.classList.remove('show');}); if(P&&P.Print8) P.Print8.hide(); }
function p8Lang(l){ LANG=l==='fr'?'fr':'ar'; document.body.classList.toggle('fr',LANG==='fr'); document.documentElement.dir=LANG==='fr'?'ltr':'rtl'; }
/* ───── منقول حرفياً ───── */
function loadScriptOnce(src){
return new Promise(function(resolve,reject){
if(document.querySelector('script[data-lazy="'+src+'"]')){resolve();return;}
var s=document.createElement('script');
s.src=src;s.dataset.lazy=src;
s.onload=function(){resolve();};
s.onerror=function(){reject(new Error('تعذّر تحميل المكتبة — تحقق من الاتصال بالإنترنت'));};
document.head.appendChild(s);
});
}
function ensurePdfLib(){
return typeof PDFLib!=='undefined'?Promise.resolve():loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
}
function ensureHtml2Canvas(){
return typeof html2canvas!=='undefined'?Promise.resolve():loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
}
function fmt(n){return Math.abs(n).toLocaleString('fr-MA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtD(v){if(!v)return'—';var p=v.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pieceStartVal(){
var ci=JSON.parse(localStorage.getItem('eurv102_ci')||'{}');
var v=parseInt(ci.piecestart);
return isNaN(v)?59766:v;
}
function nextPieceNum(){
var n=localStorage.getItem('eurv102_piece');
var v=(n!=null?parseInt(n):pieceStartVal())+1;
localStorage.setItem('eurv102_piece',v);
return String(v).padStart(7,'0');
}

function fillReceipt(client,plate,police,ins,ds,de,paid,off,diff,payMode,payRef,num,date,user,av){
var ci=JSON.parse(localStorage.getItem('eurv102_ci')||'{}');
document.getElementById('r-ci-name').textContent=ci.name||'EUR assurance';
document.getElementById('r-num').textContent='N° '+num;
document.getElementById('r-date').textContent=date;
document.getElementById('r-user').textContent=(av||'👤')+' '+user;
document.getElementById('r-client').textContent=client||'—';
document.getElementById('r-csign').textContent=client&&client!=='—'?client:'';
document.getElementById('r-ins').textContent=ins||'—';
document.getElementById('r-paid').textContent=fmt(paid)+' DH';
document.getElementById('r-off').textContent=fmt(off)+' DH';
document.getElementById('r-paymode').textContent=payMode==='cheque'?'📄 Chèque':payMode==='tpe'?'💳 TPE':'💵 '+(LANG==='fr'?'Espèces':'نقداً');
var rrow=document.getElementById('r-payref-row');if(payRef){rrow.style.display='flex';document.getElementById('r-payref').textContent=payRef;}else rrow.style.display='none';
var pr=document.getElementById('r-pr');if(plate){pr.style.display='flex';document.getElementById('r-plate').textContent=plate;}else pr.style.display='none';
var polr=document.getElementById('r-polr');if(police){polr.style.display='flex';document.getElementById('r-police').textContent=police;}else polr.style.display='none';
var dr=document.getElementById('r-dr');if(ds){dr.style.display='flex';document.getElementById('r-dates').textContent=fmtD(ds)+' → '+fmtD(de);}else dr.style.display='none';
var tv=document.getElementById('r-tv');tv.textContent=fmt(Math.abs(diff))+' DH';
if(diff>0){tv.className='rctv pos';document.getElementById('r-tl').textContent='↩️ '+(LANG==='fr'?'Montant remboursé':'المبلغ المُرجَع');}
else if(diff<0){tv.className='rctv neg2';document.getElementById('r-tl').textContent='⚠️ '+(LANG==='fr'?'Solde restant dû':'المبلغ المديون');}
else{tv.className='rctv';document.getElementById('r-tl').textContent='✅ '+(LANG==='fr'?'Compte soldé':'الحساب مطابق');tv.textContent='0.00 DH';}
var ci2=JSON.parse(localStorage.getItem('eurv102_ci')||'{}');
document.getElementById('r-footer').textContent=(ci2.name||'EUR assurance')+(ci2.phone?' · '+ci2.phone:'')+(ci2.addr?' · '+ci2.addr:'');
}
function buildRec(){
if(!LAST.paid){alert(LANG==='fr'?"Calculez d'abord":'احسب أولاً');return false;}
var num=document.getElementById('h-rec').textContent||curN();
fillReceipt(document.getElementById('client').value,document.getElementById('plate').value,document.getElementById('police-num').value,getDesc(),document.getElementById('date-s').value,document.getElementById('date-e').value,LAST.paid,LAST.off,LAST.diff,PAY_MODE,getPayRef(),num,new Date().toLocaleDateString('fr-FR')+' '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),CUR.n,CUR.av);
return true;
}
function buildRecFromHist(h){fillReceipt(h.client,h.plate,h.police,h.ins,h.ds,h.de,h.paid,h.off,h.diff,h.payMode,h.payRef,h.num,h.date+(h.time?' '+h.time:''),h.user,h.av);document.getElementById('receipt').classList.add('show');}
function doPrint(size){var s=document.getElementById('print-sty');if(!s){s=document.createElement('style');s.id='print-sty';document.head.appendChild(s);}s.textContent=size==='80mm'?'@page{size:80mm auto;margin:3mm;}':size==='a4'?'@page{size:A4 portrait;margin:10mm;}':'@page{size:A5 portrait;margin:8mm;}';document.querySelector('#receipt .print-size-row').style.display='none';setTimeout(function(){window.print();setTimeout(function(){document.querySelector('#receipt .print-size-row').style.display='flex';},500);},150);}

/* ══════════════════════════════════════════════════════════
PIÈCE DE RECETTE — reçu officiel dupliqué (client + agence)
══════════════════════════════════════════════════════════ */
function pf(label,value){return'<span class="pf-label">'+label+' :</span> <span class="pf-val">'+value+'</span>';}
function pieceCopyHtml(ci,pieceNum,police,usage,attest,ds,de,client,off,paid,reliquat,city,dateHeure){
var addrLine=ci.addr2?escHtml(ci.addr2)+(ci.ice?'  - ICE':''):'';
var html='<div class="piece-copy">';
/* ── Header: company block (left) + title/number block (right) ── */
html+='<div class="piece-head">';
html+='<div class="piece-head-l">';
html+='<div class="piece-co">'+escHtml(ci.name||'EUR-ASSURANCES SARL')+'</div>';
if(addrLine)html+='<div class="piece-addr">'+addrLine+'</div>';
if(ci.ice)html+='<div class="piece-addr">'+escHtml(ci.ice)+'</div>';
if(ci.phone)html+='<div class="piece-tel">Tél :  '+escHtml(ci.phone)+'</div>';
if(city)html+='<div class="piece-ville">'+escHtml(city)+'</div>';
html+='</div>';
html+='<div class="piece-head-r">';
html+='<div class="piece-tt">PIECE DE RECETTE</div>';
html+='<div class="piece-num">'+pieceNum+'</div>';
html+='</div>';
html+='</div>';
/* ── Fields grid ── */
html+='<div class="piece-frow"><div class="pf-cell wide">'+pf('Police N°',escHtml(police||'-'))+'</div><div class="pf-cell piece-usage-cell" style="display:none">'+pf('Usage',escHtml(usage||''))+'</div><div class="pf-cell">'+(attest?pf('Attestation',escHtml(attest)):'')+'</div></div>';
if(ds)html+='<div class="piece-frow"><div class="pf-cell wide">'+pf('Période de garantie du',fmtD(ds))+'</div><div class="pf-cell"></div><div class="pf-cell">'+pf('Au',fmtD(de))+'</div></div>';
html+='<div class="piece-frow"><div class="pf-cell wide">'+pf('Assuré',escHtml(client||'-'))+'</div></div>';
html+='<div class="piece-frow"><div class="pf-cell wide">'+pf('Prime Totale',fmt(off))+'</div></div>';
html+='<div class="piece-frow"><div class="pf-cell wide">'+pf('Espèces',fmt(paid))+'</div><div class="pf-cell"></div><div class="pf-cell">'+pf('Reliquat',fmt(reliquat))+'</div></div>';
html+='<div class="piece-foot">Fait à '+(city?escHtml(city)+', ':'')+'le '+dateHeure+'</div>';
html+='</div>';
return html;
}
function renderPieceReceipt(opts){
LAST_PIECE_NUM=opts.pieceNum;
var ci=JSON.parse(localStorage.getItem('eurv102_ci')||'{}');
var city=ci.city||'';
/* Espèces = المبلغ الفعلي المستلم، لكن مقفول عند حد Prime Totale (ما يطلع أكتر من السعر الرسمي حتى لو دفع أكتر).
Reliquat = الباقي المستحق على الزبون فقط إذا دفع أقل من السعر الرسمي (وإلا 0). */
var especes=Math.round(Math.min(opts.paid,opts.off)*100)/100;
var reliquat=Math.max(0,Math.round((opts.off-opts.paid)*100)/100);
var copy=pieceCopyHtml(ci,opts.pieceNum,opts.police,opts.usage,opts.attest,opts.ds,opts.de,opts.client,opts.off,especes,reliquat,city,opts.dateHeure);
document.getElementById('piece-wrap').innerHTML=copy+'<div class="piece-sep"></div>'+copy;
document.getElementById('receipt-piece').classList.add('show');
}

function togglePieceUsage(){
  var cells=document.querySelectorAll('.piece-usage-cell');
  if(!cells.length)return;
  var btn=document.getElementById('piece-usage-toggle-btn');
  var isHidden=(cells[0].style.display==='none'||cells[0].style.display==='');
  // Actually check computed visibility
  var showing=cells[0].offsetParent!==null&&cells[0].style.display!=='none';
  if(showing){
    cells.forEach(function(c){c.style.display='none';});
    if(btn){btn.classList.remove('on');}
  } else {
    cells.forEach(function(c){c.style.display='';});
    if(btn){btn.classList.add('on');}
  }
}
function buildPieceReceipt(){
if(!LAST.paid){alert(LANG==='fr'?"Calculez d'abord":'احسب أولاً');return;}
var num=getPieceNum();
if(num===null)return;
var now=new Date();
var dateHeure=now.toLocaleDateString('fr-FR')+' à '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
renderPieceReceipt({
pieceNum:num,
police:document.getElementById('police-num').value.trim(),
attest:(document.getElementById('attest-num')||{value:''}).value.trim(),
usage:USAGE,
ds:document.getElementById('date-s').value,
de:document.getElementById('date-e').value,
client:document.getElementById('client').value.trim(),
off:LAST.off,paid:LAST.paid,
dateHeure:dateHeure
});
}
function buildPieceReceiptFromHist(h){
/* رقم ثابت لكل عملية: يُخصَّص مرة واحدة فقط ويُحفظ داخل السجل نفسه، ولا يتغير بعدها */
if(!h.pieceNum){
h.pieceNum=nextPieceNum();
svH();

function textToImageData(text,opts){
opts=opts||{};
var fontSize=opts.size||44;
var isAr=/[\u0600-\u06FF]/.test(text);
var fontFamily=isAr?"'Tajawal',Arial,sans-serif":"'Inter',Arial,sans-serif";
var measure=document.createElement('canvas').getContext('2d');
measure.font=fontSize+'px '+fontFamily;
var textWidth=Math.ceil(measure.measureText(text).width)+16;
var canvas=document.createElement('canvas');
canvas.width=textWidth;canvas.height=Math.ceil(fontSize*1.5);
var ctx=canvas.getContext('2d');
ctx.font=fontSize+'px '+fontFamily;
ctx.fillStyle=opts.color||'#000';
ctx.textBaseline='top';
ctx.direction=isAr?'rtl':'ltr';
ctx.textAlign=isAr?'right':'left';
ctx.fillText(text,isAr?canvas.width-8:8,4);
return {dataUrl:canvas.toDataURL('image/png'),width:canvas.width,height:canvas.height};
}

function dataURLToBytes(dataUrl){
var base64=dataUrl.split(',')[1];
var binary=atob(base64);
var bytes=new Uint8Array(binary.length);
for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
return bytes;
}

// Draws `text` on a pdf-lib page at PDF coordinates (x,y = bottom-left
// origin), rendered as a crisp raster image so Arabic joins correctly.
function drawTextOnPdfPage(pdfDoc,page,text,x,y,fontSizePt){
text=String(text||'').trim();
if(!text)return Promise.resolve();
var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
return ready.then(function(){
var scaleFactor=4;
var img=textToImageData(text,{size:fontSizePt*scaleFactor});
var pngBytes=dataURLToBytes(img.dataUrl);
return pdfDoc.embedPng(pngBytes).then(function(pngImage){
var wPt=img.width/scaleFactor,hPt=img.height/scaleFactor;
page.drawImage(pngImage,{x:x,y:y-hPt*0.72,width:wPt,height:hPt});
});
});
}

// Download the currently open receipt (وصل) as a real PDF file.
function downloadReceiptPDF(){
var txt=buildShareTxt();
var lines=txt.split('\n');
ensurePdfLib().then(function(){
return PDFLib.PDFDocument.create().then(function(pdfDoc){
var page=pdfDoc.addPage([280,60+lines.length*18]);
var y=page.getHeight()-30;
var chain=Promise.resolve();
lines.forEach(function(line){
var yy=y;
chain=chain.then(function(){return drawTextOnPdfPage(pdfDoc,page,line,20,yy,10);});
y-=18;
});
return chain.then(function(){return pdfDoc.save();});
});
}).then(function(bytes){
var blob=new Blob([bytes],{type:'application/pdf'});
var a=document.createElement('a');
a.href=URL.createObjectURL(blob);
var num=(document.getElementById('r-num').textContent||'recu').replace(/[^a-zA-Z0-9-]/g,'');
a.download='recu-'+num+'.pdf';
document.body.appendChild(a);a.click();document.body.removeChild(a);
}).catch(function(e){console.error(e);alert((LANG==='fr'?'Erreur PDF: ':'خطأ PDF: ')+e.message);});
}
