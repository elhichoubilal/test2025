<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4F6F8">
<title>RenewPro 7 Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v7.css">
</head>
<body>

<!-- ═════════ الدخول ═════════ -->
<div id="splash" class="splash"><div class="brand big">RenewPro <span>7</span></div></div>
<div id="login" class="login hide">
  <form class="lg-card" id="lg-form" autocomplete="on">
    <div class="lg-logo">R</div>
    <div class="brand big">RenewPro <span>7</span></div>
    <div class="lg-sub" id="lg-sub">تسجيل الدخول</div>
    <input id="lg-email" class="inp" type="email" dir="ltr" autocomplete="username" placeholder="البريد الإلكتروني" required>
    <input id="lg-pass" class="inp" type="password" dir="ltr" autocomplete="current-password" placeholder="كلمة السر" required>
    <button class="btn pri wide" id="lg-btn" type="submit">دخول</button>
    <div class="lg-err" id="lg-err"></div>
  </form>
</div>

<!-- ═════════ التطبيق ═════════ -->
<div id="app" class="app hide">
  <header class="top">
    <div class="brand"><i>R</i>RenewPro <span>7</span></div>
    <button class="top-search" id="top-search" data-act="search-open" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span>بحث</span><kbd>Ctrl K</kbd></button>
    <div class="top-list" id="top-list"></div>
    <div class="top-acts" id="top-acts"></div>
    <button class="top-b opt lang-b" id="lang-b" data-act="lang-toggle" aria-label="language">FR</button>
    <button class="top-b opt" id="theme-b" data-act="theme-toggle" aria-label="theme">🌙</button>
    <button class="top-b hide" id="install-b" data-act="pwa-install" aria-label="install">📲</button>
    <div class="sync" id="sync" title=""></div>
    <button class="uchip" id="uchip" data-act="nav" data-id="control"></button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="view" id="view"></main>
  <button class="fab" id="fab7" data-act="fab7" type="button"><b>+</b><span>عملية جديدة</span></button>
  <aside class="sheet" id="sheet"><div class="sheet-body" id="sheet-body"></div></aside>
</div>

<div class="session" id="session"></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept=".xlsx,.xls,.csv" hidden>
